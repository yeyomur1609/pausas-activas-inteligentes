# ARCHIVO: render.yaml
# Blueprint declarativo para desplegar el Backend API en Render (Free Tier con Docker + Azure SQL)
services:
  - type: web
    name: pausas-activas-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: America/Monterrey
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_TTL_SECONDS
        value: "604800"
      - key: APP_KEY
        sync: false
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: DB_DRIVER
        value: sqlsrv
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        value: pausas_activas_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "yes"
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: "no"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: tls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Pausas Activas Inteligentes
      - key: OSM_CACHE_TTL_SECONDS
        value: "300"
