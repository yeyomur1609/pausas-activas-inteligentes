<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo de Pausas Activas Inteligentes">
  <defs>
    <linearGradient id="paiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e6f65"/>
      <stop offset="60%" stop-color="#23574f"/>
      <stop offset="100%" stop-color="#19413b"/>
    </linearGradient>
    <linearGradient id="paiBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9cc6be"/>
      <stop offset="50%" stop-color="#e9f3f1"/>
      <stop offset="100%" stop-color="#f26b50"/>
    </linearGradient>
    <radialGradient id="paiGlow" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#f26b50" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2e6f65" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paiStretchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb8067"/>
      <stop offset="100%" stop-color="#f26b50"/>
    </linearGradient>
    <linearGradient id="paiParkWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#bfe0da"/>
      <stop offset="100%" stop-color="#f26b50"/>
    </linearGradient>
    <linearGradient id="paiHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9f3f1"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#paiBgGrad)" stroke="url(#paiBorderGrad)" stroke-width="3.5"/>
  <circle cx="64" cy="56" r="46" fill="url(#paiGlow)"/>

  <!-- Estrella de Inteligencia Artificial (ActiBot) -->
  <path d="M95 21 L97.6 28.4 L105 31 L97.6 33.6 L95 41 L92.4 33.6 L85 31 L92.4 28.4 Z" fill="#f26b50"/>
  <circle cx="32" cy="30" r="2.8" fill="#e9f3f1" opacity="0.9"/>

  <!-- Figura humana realizando pausa activa de estiramiento -->
  <circle cx="64" cy="34" r="9.5" fill="url(#paiHeadGrad)"/>
  <path d="M33 47 C46 65, 82 65, 95 45" fill="none" stroke="url(#paiStretchGrad)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M64 49 V78" fill="none" stroke="#f8fafc" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Onda topográfica y parques de La Huasteca -->
  <path d="M25 92 Q45 77 64 89 T103 82" fill="none" stroke="url(#paiParkWaveGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M39 102 Q64 94 89 101" fill="none" stroke="#bfe0da" stroke-width="3.5" stroke-linecap="round" opacity="0.82"/>
</svg>
